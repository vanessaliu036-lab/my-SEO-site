name: PR 142 validation

on:
  pull_request:
    branches:
      - release/occ-current
    paths:
      - "next.config.mjs"
      - "components/AnalyticsGate.tsx"
      - "tests/**"
      - ".github/workflows/pr142-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
