name: OCC release QA

on:
  push:
    branches: [release/occ-current]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repository tests
        run: npm test
      - name: TypeScript verification
        if: ${{ always() }}
        run: npx tsc --noEmit
      - name: Release quality report
        if: ${{ always() }}
        run: npm run release:quality
      - name: Next.js build
        if: ${{ always() }}
        run: npm run build
