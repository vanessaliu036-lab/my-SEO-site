name: Security - Static analysis and secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan current changes and tracked files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks dir . --redact --exit-code 1
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            gitleaks git . --log-opts="$PR_BASE_SHA..$PR_HEAD_SHA" --redact --exit-code 1
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            gitleaks git . --log-opts="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA" --redact --exit-code 1
          fi

  semgrep:
    name: Semgrep security rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.176.0

      - name: Scan with security audit and OWASP rules
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --metrics off --error .

  npm-audit:
    name: npm audit for high and critical advisories
    runs-on: ubuntu-latest
    steps:
      - name: Check out manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit locked dependencies
        run: npm audit --audit-level=high
