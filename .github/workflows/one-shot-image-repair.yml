name: One-shot OCC image ownership repair

on:
  push:
    branches:
      - fix/cross-page-image-ownership-20260917
    paths:
      - .github/workflows/one-shot-image-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-page-image-ownership-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply route-owned image repair
        run: node scripts/apply-image-ownership-repair.mjs
      - name: Remove one-shot repair machinery
        run: rm scripts/apply-image-ownership-repair.mjs .github/workflows/one-shot-image-repair.yml
      - name: Verify focused regression tests
        run: node --test tests/occ-editorial-image-ownership.test.mjs tests/occ-about-image-uniqueness.test.mjs
      - name: Verify repository-wide static image ownership
        run: node scripts/audit-editorial-images.mjs
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce route-owned editorial images"
          git push origin HEAD:fix/cross-page-image-ownership-20260917
