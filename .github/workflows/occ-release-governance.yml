name: OCC release governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
      - name: Governance unit tests
        run: npm run test:release-governance
      - name: Content preservation
        run: node scripts/verify-protected-content.mjs
      - name: Editorial image ownership
        run: node scripts/audit-editorial-images.mjs
      - name: Static asset integrity
        run: node scripts/verify-static-assets.mjs
